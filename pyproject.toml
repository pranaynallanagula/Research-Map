[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "research-map"
version = "0.1.0"
description = "A research workspace that indexes papers, answers questions with citations, and builds a knowledge graph of the literature."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Pranay Nallanagula" },
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "pgvector>=0.3,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "mypy>=1.13",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["research_map"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.mypy]
mypy_path = "src"
packages = ["research_map"]
python_version = "3.11"
strict = true
warn_unused_configs = true
